services:
  - type: web
    name: clinical-ai-copilot
    env: docker
    region: oregon
    plan: free
    branch: main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"
      - key: DATABASE_URL
        fromDatabase:
          name: copilot-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
    autoDeploy: true

databases:
  - name: copilot-db
    databaseName: copilot
    user: copilot_user
    plan: free
    region: oregon
