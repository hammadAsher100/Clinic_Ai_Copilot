name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: test-secret-key-for-ci
      JWT_SECRET_KEY: test-jwt-secret-for-ci
      ENVIRONMENT: test
      SKIP_MODEL_LOAD_ON_STARTUP: "true"
      GROQ_API_KEY: "test-key"
      MODEL_REGISTRY_PATH: "ml/registry"
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgl1 \
          libglib2.0-0 \
          libgomp1 \
          libsm6 \
          libxext6 \
          libxrender-dev
        
    - name: Install Python dependencies
      timeout-minutes: 15
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt 2>&1 | tee pip-install.log || (echo "Pip install failed, showing last 50 lines:" && tail -50 pip-install.log && exit 1)
        
    - name: Create required directories
      run: |
        mkdir -p data/uploads data/reports data/processed/{tabular,text,xray} data/raw ml/registry
        
    - name: Run tests
      timeout-minutes: 10
      run: |
        pytest tests/ -v --tb=short -x
        
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail the build on linting issues
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
        
    - name: Run flake8
      run: |
        # Only check for syntax errors and undefined names
        flake8 api/ ml/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
        
    - name: Check code formatting with black
      run: |
        black --check api/ ml/ || true
        
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to DockerHub
      if: github.event_name == 'push'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: clinical-copilot:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Push to DockerHub
      if: github.event_name == 'push' && secrets.DOCKERHUB_USERNAME != ''
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/clinical-copilot:latest,${{ secrets.DOCKERHUB_USERNAME }}/clinical-copilot:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
