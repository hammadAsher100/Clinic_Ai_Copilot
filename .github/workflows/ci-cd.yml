name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: test-secret-key-for-ci
      ENVIRONMENT: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgl1 \
          libglib2.0-0 \
          libgomp1 \
          libsm6 \
          libxext6 \
          libxrender-dev
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create required directories
      run: |
        mkdir -p data/uploads data/reports data/processed/{tabular,text,xray} data/raw ml/registry
        
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
        
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
        
    - name: Run flake8
      run: |
        flake8 api/ ml/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 api/ ml/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Check code formatting with black
      run: |
        black --check api/ ml/ || true
        
  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to DockerHub
      if: github.event_name == 'push'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: clinical-copilot:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Push to DockerHub
      if: github.event_name == 'push' && secrets.DOCKERHUB_USERNAME != ''
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/clinical-copilot:latest,${{ secrets.DOCKERHUB_USERNAME }}/clinical-copilot:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
